<!doctype html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/lucas.jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0F172A" />
  <title>GrowFit - Nutrition & Fitness Tracker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Plus Jakarta Sans + Space Grotesk + Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- HTML5 QR & Barcode Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#10B981",          // Emerald 500
            "primary-dark": "#059669",     // Emerald 600
            "primary-deep": "#064E3B",     // Emerald 950
            "primary-light": "rgba(16, 185, 129, 0.15)",
            "primary-soft": "rgba(16, 185, 129, 0.25)",
            "background-light": "#0F172A", // Deep Slate 900 (not pitch black)
            "background-dark": "#090E17",
            "surface-white": "#1E293B",   // Slate 800 Card Container
            "surface-card": "#1E293B",
            "surface-hover": "#283548",
            "text-primary": "#F8FAFC",     // Crisp White for readable headings
            "text-emerald": "#34D399",     // Vibrant Emerald 400
            "text-muted": "#94A3B8",       // Slate 400 for secondary text
            "border-soft": "#334155",      // Slate 700
            "border-emerald": "rgba(16, 185, 129, 0.35)"
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "Space Grotesk", "Inter", "sans-serif"],
            "body": ["Plus Jakarta Sans", "Inter", "-apple-system", "sans-serif"],
            "mono": ["Space Grotesk", "Plus Jakarta Sans", "Inter", "sans-serif"],
            "heading": ["Plus Jakarta Sans", "Space Grotesk", "Inter", "sans-serif"]
          },
          boxShadow: {
            "emerald-sm": "0 2px 10px rgba(16, 185, 129, 0.2)",
            "emerald-md": "0 10px 25px -5px rgba(16, 185, 129, 0.25)",
            "emerald-lg": "0 20px 35px -10px rgba(16, 185, 129, 0.35)",
            "card-clean": "0 4px 20px -2px rgba(0, 0, 0, 0.4), 0 2px 6px -1px rgba(0, 0, 0, 0.2)"
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>

<body class="bg-[#0F172A] text-[#F8FAFC] antialiased font-body selection:bg-emerald-500/30 selection:text-emerald-200">
  <div id="app"></div>
  
  <!-- Global Notification Modal -->
  <div id="global-modal"
    class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/70 backdrop-blur-md p-4 transition-all duration-300">
    <div id="global-modal-content" class="w-full max-w-sm"></div>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>

</html>
