<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/lucas.jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00FF88", // GrowLabs Neon Green
            "background-dark": "#000000",
            "surface-dark": "rgba(10, 10, 10, 0.7)",
            "text-secondary": "#9CA3AF",
            "border-color": "rgba(255, 255, 255, 0.1)"
          },
          fontFamily: {
            "display": ["Outfit", "sans-serif"],
            "mono": ["Space Mono", "monospace"]
          },
          animation: {
            "glow": "glow 2s ease-in-out infinite alternate",
            "float": "float 6s ease-in-out infinite",
          },
          keyframes: {
            glow: {
              "from": { "box-shadow": "0 0 5px #00FF88, 0 0 10px #00FF88" },
              "to": { "box-shadow": "0 0 20px #00FF88, 0 0 30px #00FF88" }
            },
            float: {
              "0%, 100%": { "transform": "translateY(0)" },
              "50%": { "transform": "translateY(-10px)" }
            }
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>

<body>
  <div id="app"></div>
  <!-- Global Notification Modal -->
  <div id="global-modal"
    class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div id="global-modal-content" class="animate-scale-up"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
